<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello · Korg experiments</title>
  <meta name="description" content="A friendly hello from Korg experiments." />
  <link rel="stylesheet" href="../../css/site.css" />
  <style>
    .hello-card {
      margin: 1.5rem 0;
      padding: 1.5rem 1.25rem;
      border-radius: 1rem;
      border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
      background: color-mix(in srgb, var(--card) 88%, transparent);
      text-align: center;
    }
    .hello-card h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
    }
    .hello-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }
    a.back {
      display: inline-flex;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="page">
    <p><a class="back" href="../../">← Back home</a></p>
    <div class="hello-card">
      <h1>🙌 Hello there!</h1>
      <p>Glad you stopped by. This is a temporary hoop — just a friendly wave from the basket.</p>
    </div>
  </main>
  <script src="../../reload.js" defer></script>
  <script src="../../js/animations.js" defer></script>
  <script src="../../js/i18n.js" defer></script>
</body>
</html>
