<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pong · Korg experiments</title>
  <meta name="description" content="A tiny Pong game inside Korg experiments." />
  <link rel="stylesheet" href="../../css/site.css" />
  <link rel="stylesheet" href="pong.css" />
</head>
<body data-i18n-title="pong_document_title" data-i18n-meta="pong_meta_description" data-korg-page="hoop">
  <main>
    <div class="top-bar">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="sv" aria-pressed="false">SV</button>
      </div>
    </div>
    <header class="hero">
      <span class="basket" role="img" data-i18n="basket_aria" data-i18n-attr="aria-label">🧺</span>
      <div class="hero-text">
        <span class="eyebrow" data-i18n="eyebrow">AI experiment</span>
        <h1 data-i18n="header_title">Korg experiments</h1>
      </div>
    </header>

    <div id="content">
      <div class="pong-page" id="wrap">
        <div class="top">
          <a class="back" id="back" href="../../">← Back home</a>
          <div class="heading-with-korg">
            <span class="header-basket" role="img" aria-hidden="true">🧺</span>
            <h1 data-i18n="pong_heading">Pong · Korg experiments</h1>
          </div>
          <div class="score" id="score" aria-live="polite">0 : 0</div>
        </div>
        <div class="stage">
          <canvas id="game" width="960" height="600" data-i18n="pong_canvas_label" data-i18n-attr="aria-label"></canvas>
        </div>
        <p class="hint" data-i18n="pong_hint">You: W / S or ↑ / ↓, or drag / hold on your half. Opponent is automatic. First to whatever — just have fun.</p>
      </div>
    </div>

    <footer>
      <span data-i18n="footer_published_prefix">Published from the GitHub repository </span><a href="https://github.com/ChrisAcrobat/korg-experiment" data-i18n="footer_published_link">korg-experiment</a>.<br />
      <span data-i18n="footer_updated">Updated: September 27, 2026.</span>
    </footer>
  </main>

  <script src="../../reload.js" defer></script>
  <script src="../../js/animations.js" defer></script>
  <script src="../../js/i18n.js" defer></script>
  <script src="../../js/hoops.js" defer></script>
  <script src="../../js/navigation.js" defer></script>
  <script src="../../js/home.js" defer></script>
  <script type="module" src="pong-app.js" data-korg-mount></script>
</body>
</html>
