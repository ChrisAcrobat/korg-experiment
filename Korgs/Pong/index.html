<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pong · Korg experiments</title>
  <meta name="description" content="A tiny Pong game inside Korg experiments." />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --accent: #a78bfa;
      --card: #1a1d24;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9;
        --fg: #1a1d24;
        --muted: #5f6368;
        --accent: #6d28d9;
        --card: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(72px);
      will-change: transform;
    }
    body::before {
      width: min(68vw, 40rem);
      height: min(68vw, 40rem);
      margin: calc(min(68vw, 40rem) / -2) 0 0 calc(min(68vw, 40rem) / -2);
      background: color-mix(in srgb, var(--accent) 30%, transparent);
      opacity: 0.85;
      animation: edge-glow-orbit 40s linear infinite;
    }
    body::after {
      width: min(48vw, 28rem);
      height: min(48vw, 28rem);
      margin: calc(min(48vw, 28rem) / -2) 0 0 calc(min(48vw, 28rem) / -2);
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      opacity: 0.7;
      animation: edge-glow-orbit 56s linear infinite reverse;
      animation-delay: -14s;
    }
    @keyframes edge-glow-orbit {
      from { transform: rotate(0deg) translateX(min(44vw, 20rem)); }
      to { transform: rotate(360deg) translateX(min(44vw, 20rem)); }
    }
    @media (prefers-reduced-motion: reduce) {
      body::before, body::after { animation: none; }
      body::before { transform: translate(-28vw, -32vh); }
      body::after { transform: translate(30vw, -18vh); }
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: min(52rem, 100%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transform-origin: bottom left;
      transition: transform 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95), opacity 1.4s ease;
    }
    body.is-leaving .wrap {
      transform: translate(1.25rem, calc(100vh - 100% - 1.5rem)) scale(0.08);
      opacity: 0;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    a.back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      border-radius: 999px;
      padding: 0.45rem 0.95rem;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      font-size: 0.9rem;
    }
    a.back:hover { text-decoration: underline; }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .heading-with-korg {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .header-basket {
      font-size: 1.35rem;
      line-height: 1;
      filter: drop-shadow(0 4px 10px color-mix(in srgb, var(--accent) 30%, transparent));
    }
    .score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--fg);
      background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      backdrop-filter: blur(8px);
    }
    .stage {
      position: relative;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
      background: color-mix(in srgb, var(--card) 88%, transparent);
      box-shadow: 0 20px 50px color-mix(in srgb, #000 25%, transparent);
      aspect-ratio: 16 / 10;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: ns-resize;
    }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .corner-basket {
      position: fixed;
      left: 1.25rem;
      bottom: 1.25rem;
      font-size: 2.5rem;
      line-height: 1;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 8px 16px color-mix(in srgb, var(--accent) 40%, transparent));
      transition: opacity 0.4s ease 0.9s;
    }
    body.is-leaving .corner-basket { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .wrap { transition: none; }
      .corner-basket { transition: none; }
    }
  </style>
</head>
<body data-i18n-title="pong_document_title" data-i18n-meta="pong_meta_description">
  <div class="wrap" id="wrap">
    <div class="top">
      <a class="back" id="back" href="../../" data-i18n="pong_back">← Back home</a>
      <div class="heading-with-korg">
        <span class="header-basket" role="img" data-i18n="basket_aria" data-i18n-attr="aria-label">🧺</span>
        <h1 data-i18n="pong_heading">Pong · Korg experiments</h1>
      </div>
      <div class="score" id="score" aria-live="polite">0 : 0</div>
    </div>
    <div class="stage">
      <canvas id="game" width="960" height="600" data-i18n="pong_canvas_label" data-i18n-attr="aria-label"></canvas>
    </div>
    <p class="hint" data-i18n="pong_hint">You: W / S or ↑ / ↓, or drag / hold on your half. Opponent is automatic. First to whatever — just have fun.</p>
  </div>
  <span class="corner-basket" aria-hidden="true">🏀</span>
  <script src="../../reload.js" defer></script>
  <script src="../../js/animations.js" defer></script>
  <script src="../../js/i18n.js" defer></script>
  <script defer>
    (function () {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const back = document.getElementById("back");
      const W = canvas.width;
      const H = canvas.height;

      const paddleW = 14;
      const paddleH = 90;
      const ballR = 9;
      const player = { x: 28, y: H / 2 - paddleH / 2, vy: 0 };
      const cpu = { x: W - 28 - paddleW, y: H / 2 - paddleH / 2 };
      let ball = { x: W / 2, y: H / 2, vx: 5, vy: 3 };
      let scoreP = 0;
      let scoreC = 0;
      const keys = new Set();
      let pointerY = null;
      let pointerActive = false;
      let running = true;
      let scoreSep = " : ";
      let idleTimer = null;

      function markBusy() {
        if (window.KorgInteraction) window.KorgInteraction.setBusy(true);
        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(function () {
          if (window.KorgInteraction) window.KorgInteraction.setBusy(false);
        }, 12000);
      }
      markBusy();
      window.addEventListener("keydown", markBusy);
      canvas.addEventListener("pointerdown", markBusy);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden && window.KorgInteraction) {
          window.KorgInteraction.setBusy(false);
        }
      });

      function resetBall(dir) {
        ball.x = W / 2;
        ball.y = H / 2;
        const speed = 5.2;
        const angle = (Math.random() * 0.7 - 0.35);
        ball.vx = dir * speed * Math.cos(angle);
        ball.vy = speed * Math.sin(angle) * 1.4;
        if (Math.abs(ball.vy) < 1.5) ball.vy = (Math.random() < 0.5 ? -1 : 1) * 2;
      }

      function updateScore() {
        scoreEl.textContent = scoreP + scoreSep + scoreC;
      }

      function syncI18n() {
        if (window.KorgI18n) {
          scoreSep = window.KorgI18n.t("score_separator", " : ");
          updateScore();
        }
      }
      document.addEventListener("i18n:ready", syncI18n);
      if (window.KorgI18n && window.KorgI18n.ready) {
        window.KorgI18n.ready.then(syncI18n).catch(function () {});
      }

      window.addEventListener("keydown", (e) => {
        if (["ArrowUp", "ArrowDown", "w", "W", "s", "S"].includes(e.key)) {
          e.preventDefault();
          keys.add(e.key);
        }
      });
      window.addEventListener("keyup", (e) => keys.delete(e.key));

      function pointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return ((clientY - rect.top) / rect.height) * H;
      }
      canvas.addEventListener("pointerdown", (e) => {
        pointerActive = true;
        pointerY = pointerPos(e);
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!pointerActive) return;
        pointerY = pointerPos(e);
      });
      canvas.addEventListener("pointerup", () => { pointerActive = false; });
      canvas.addEventListener("pointercancel", () => { pointerActive = false; });

      function step() {
        if (!running) return;

        let dy = 0;
        if (keys.has("ArrowUp") || keys.has("w") || keys.has("W")) dy -= 1;
        if (keys.has("ArrowDown") || keys.has("s") || keys.has("S")) dy += 1;
        if (dy !== 0) {
          player.y += dy * 7.5;
        } else if (pointerActive && pointerY != null) {
          player.y += (pointerY - paddleH / 2 - player.y) * 0.28;
        }
        player.y = Math.max(8, Math.min(H - paddleH - 8, player.y));

        const target = ball.y - paddleH / 2;
        const cpuSpeed = 4.2 + Math.min(2, (scoreP + scoreC) * 0.15);
        cpu.y += Math.max(-cpuSpeed, Math.min(cpuSpeed, target - cpu.y));
        cpu.y = Math.max(8, Math.min(H - paddleH - 8, cpu.y));

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.y - ballR < 0) { ball.y = ballR; ball.vy *= -1; }
        if (ball.y + ballR > H) { ball.y = H - ballR; ball.vy *= -1; }

        function hit(p) {
          return (
            ball.x - ballR < p.x + paddleW &&
            ball.x + ballR > p.x &&
            ball.y > p.y &&
            ball.y < p.y + paddleH
          );
        }

        if (ball.vx < 0 && hit(player)) {
          ball.x = player.x + paddleW + ballR;
          const rel = (ball.y - (player.y + paddleH / 2)) / (paddleH / 2);
          const speed = Math.min(11, Math.hypot(ball.vx, ball.vy) * 1.05 + 0.2);
          ball.vx = Math.abs(speed * Math.cos(rel * 0.6));
          ball.vy = speed * Math.sin(rel * 0.75);
        }
        if (ball.vx > 0 && hit(cpu)) {
          ball.x = cpu.x - ballR;
          const rel = (ball.y - (cpu.y + paddleH / 2)) / (paddleH / 2);
          const speed = Math.min(11, Math.hypot(ball.vx, ball.vy) * 1.05 + 0.2);
          ball.vx = -Math.abs(speed * Math.cos(rel * 0.6));
          ball.vy = speed * Math.sin(rel * 0.75);
        }

        if (ball.x < -30) {
          scoreC += 1;
          updateScore();
          resetBall(1);
        } else if (ball.x > W + 30) {
          scoreP += 1;
          updateScore();
          resetBall(-1);
        }

        draw();
        requestAnimationFrame(step);
      }

      function draw() {
        const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#a78bfa";
        const fg = getComputedStyle(document.documentElement).getPropertyValue("--fg").trim() || "#e8eaed";
        const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || "#9aa0a6";

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "rgba(15, 17, 21, 0.35)";
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = muted;
        ctx.globalAlpha = 0.35;
        ctx.setLineDash([10, 14]);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(W / 2, 16);
        ctx.lineTo(W / 2, H - 16);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;

        ctx.fillStyle = accent;
        ctx.fillRect(player.x, player.y, paddleW, paddleH);
        ctx.fillRect(cpu.x, cpu.y, paddleW, paddleH);

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballR, 0, Math.PI * 2);
        ctx.fillStyle = fg;
        ctx.shadowColor = accent;
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      resetBall(Math.random() < 0.5 ? 1 : -1);
      updateScore();
      requestAnimationFrame(step);

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      back.addEventListener("click", (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        if (reduceMotion) {
          window.location.href = back.href;
          return;
        }
        running = false;
        if (window.KorgInteraction) window.KorgInteraction.setBusy(false);
        document.body.classList.add("is-leaving");
        const go = () => { window.location.href = back.href; };
        setTimeout(go, 1500);
      });
    })();
  </script>
</body>
</html>
