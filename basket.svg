<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" role="img" aria-label="Korg">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <!-- handle -->
  <path d="M28 38 C28 12, 92 12, 92 38" fill="none" stroke="url(#rim)" stroke-width="6" stroke-linecap="round"/>
  <!-- rim -->
  <ellipse cx="60" cy="40" rx="42" ry="12" fill="url(#rim)"/>
  <ellipse cx="60" cy="40" rx="34" ry="8" fill="#1a1d24" opacity="0.35"/>
  <!-- basket body -->
  <path d="M18 40 L26 86 C28 94, 92 94, 94 86 L102 40 Z" fill="url(#body)"/>
  <!-- weave lines -->
  <path d="M24 52 H96 M28 64 H92 M34 76 H86" fill="none" stroke="#ede9fe" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M40 42 V88 M60 42 V90 M80 42 V88" fill="none" stroke="#2e1065" stroke-opacity="0.25" stroke-width="2"/>
  <!-- front rim highlight -->
  <ellipse cx="60" cy="40" rx="42" ry="12" fill="none" stroke="#ddd6fe" stroke-opacity="0.5" stroke-width="2"/>
</svg>
