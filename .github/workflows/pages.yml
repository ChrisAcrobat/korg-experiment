name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate hoop list
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("Korgs")
          names = sorted(p.name for p in root.iterdir() if p.is_dir() and not p.name.startswith("."))
          (root / "hoops.json").write_text(json.dumps(names, separators=(",", ":")) + "\n", encoding="utf-8")
          print("hoops:", names)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
