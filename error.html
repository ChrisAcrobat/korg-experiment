<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Error · Korgexperiment</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --accent: #a78bfa;
      --card: #1a1d24;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9;
        --fg: #1a1d24;
        --muted: #5f6368;
        --accent: #6d28d9;
        --card: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(72px);
      will-change: transform;
    }
    body::before {
      width: min(68vw, 40rem);
      height: min(68vw, 40rem);
      margin: calc(min(68vw, 40rem) / -2) 0 0 calc(min(68vw, 40rem) / -2);
      background: color-mix(in srgb, var(--accent) 30%, transparent);
      opacity: 0.85;
      animation: edge-glow-orbit 40s linear infinite;
    }
    body::after {
      width: min(48vw, 28rem);
      height: min(48vw, 28rem);
      margin: calc(min(48vw, 28rem) / -2) 0 0 calc(min(48vw, 28rem) / -2);
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      opacity: 0.7;
      animation: edge-glow-orbit 56s linear infinite reverse;
      animation-delay: -14s;
    }
    @keyframes edge-glow-orbit {
      from { transform: rotate(0deg) translateX(min(44vw, 20rem)); }
      to { transform: rotate(360deg) translateX(min(44vw, 20rem)); }
    }
    @media (prefers-reduced-motion: reduce) {
      body::before, body::after { animation: none; }
      body::before { transform: translate(-28vw, -32vh); }
      body::after { transform: translate(30vw, -18vh); }
    }
    main {
      position: relative;
      z-index: 1;
      width: min(28rem, 100%);
      text-align: center;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      backdrop-filter: blur(10px);
      border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
      border-radius: 1.25rem;
      padding: 2.25rem 2rem;
      box-shadow: 0 20px 50px color-mix(in srgb, #000 25%, transparent);
    }
    .basket {
      font-size: 3rem;
      line-height: 1;
      display: block;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 10px 18px color-mix(in srgb, var(--accent) 35%, transparent));
      user-select: none;
    }
    .eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.6rem, 4vw, 2rem);
      line-height: 1.15;
      font-weight: 700;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.65;
      font-size: 1.05rem;
    }
    a.home {
      display: inline-block;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      border-radius: 999px;
      padding: 0.55rem 1.1rem;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    a.home:hover { text-decoration: underline; }

  </style>
</head>
<body>
  <main>
    <span class="basket" role="img" aria-label="Basket">🧺</span>
    <span class="eyebrow">Something went wrong</span>
    <h1>We dropped the basket</h1>
    <p>An unexpected error occurred. You can return to the home page and continue from there.</p>
    <a class="home" href="./">Back to home</a>
  </main>
  <!--
    The reload script must always run first.
    If something goes wrong on the page later, it still starts,
    fetches the latest version from GitHub, and fixes the page automatically.
  -->
  <script src="reload.js" defer></script>
</body>
</html>
